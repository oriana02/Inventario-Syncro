version: "3.9"

services:
  # ──────────────────────────────────────────────
  #  Microservicio de Inventario
  #  Puerto: 8082
  #  DB: MySQL en Aiven (remoto)
  #  MQ: RabbitMQ en CloudAMQP (remoto)
  # ──────────────────────────────────────────────
  ms-inventario:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncro-ms-inventario
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      # Base de datos — MySQL en Aiven
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # RabbitMQ — CloudAMQP
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}

      # Perfil activo
      SPRING_PROFILES_ACTIVE: prod

    env_file:
      - .env

networks:
  default:
    name: syncro-inventario-net
    driver: bridge
